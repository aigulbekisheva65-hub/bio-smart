<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIO-SMART</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef8f3;
  text-align: center;
  color: #173b32;
}
header {
  background: linear-gradient(135deg, #087f5b, #20c997);
  color: white;
  padding: 45px 15px;
}
h1 { font-size: 42px; margin: 10px; }
h2 { font-size: 24px; }
.container {
  max-width: 650px;
  margin: 30px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 25px;
  margin: 18px 0;
  border-radius: 18px;
  box-shadow: 0 4px 15px #00000015;
}
button {
  background: #087f5b;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 16px 25px;
  font-size: 18px;
  cursor: pointer;
}
button:hover { background: #065f46; }
footer { padding: 25px; }
</style>
</head>
<body>

<header>
  <h1>🧬 BIO-SMART</h1>
  <h2>Интерактивная платформа по биологии</h2>
  <p>Учись • Исследуй • Открывай</p>
</header>

<div class="container">

  <div class="card">
    <h2>👩‍🏫 Кабинет учителя</h2>
    <p>Создание тестов и управление заданиями</p>
    <button onclick="comingSoon()">Войти</button>
  </div>

  <div class="card">
    <h2>👨‍🎓 Кабинет ученика</h2>
    <p>Тесты и задания по биологии</p>
    <button onclick="comingSoon()">Начать тестирование</button>
  </div>

  <div class="card">
    <h2>📊 Результаты</h2>
    <p>Баллы и достижения учеников</p>
    <button onclick="comingSoon()">Посмотреть</button>
  </div>

  <div class="card">
    <h2>📱 QR-код</h2>
    <p>Быстрый доступ к заданиям</p>
    <button onclick="comingSoon()">Открыть</button>
  </div>

</div>

<footer>
  BIO-SMART © 2026
</footer>

<script>
function comingSoon() {
  alert("Этот раздел скоро появится!");
}
</script>

</body>
</html>
